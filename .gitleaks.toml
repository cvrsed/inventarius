# Configuración de gitleaks. Extiende las reglas por defecto.
# La acción de CI usa gitleaks 8.24.x: se usa la sintaxis `[allowlist]` (la de `[[allowlists]]` con targetRules es 8.25+).
# Qué se protege y por qué: CLAUDE.md, «Información sensible». `scripts/test-gitleaks.sh` prueba que cada regla salta.
title = "inventarius"

[extend]
useDefault = true

# Las contraseñas de los tests y fixtures son ficticias (CLAUDE.md: nunca secretos reales ahí).
# Se permiten SOLO archivos de prueba; el código de producción sigue cubierto por todas las reglas.
[allowlist]
description = "Contraseñas ficticias de tests y fixtures e2e"
paths = [
  '''.*\.test\.ts$''',
  '''e2e/tests/.*''',
  '''apps/api/test/.*''',
  # Este archivo define los patrones (los nombra en sus descripciones).
  '''\.gitleaks\.toml$''',
  # Hashes de integridad del lockfile: parecen hex de 32 caracteres pero no son claves.
  '''pnpm-lock\.yaml$''',
]

[[rules]]
id = "red-privada-192-168"
description = "IP interna del rango 192.168.0.0/16: usa IPs de documentación (192.0.2.0/24, 2001:db8::/32)"
regex = '''\b192\.168\.\d{1,3}\.\d{1,3}\b'''
keywords = ["192.168"]

[[rules]]
id = "red-privada-10"
description = "IP interna del rango 10.0.0.0/8: usa IPs de documentación (192.0.2.0/24, 2001:db8::/32)"
regex = '''(?:^|[^\d.])10\.\d{1,3}\.\d{1,3}\.\d{1,3}\b'''
keywords = ["10."]

[[rules]]
id = "dominio-supporti"
description = "Dominio real (supporti.cl): usa example.com o .test"
regex = '''(?i)\bsupporti\.cl\b'''
keywords = ["supporti"]

[[rules]]
id = "dominio-zensi"
description = "Dominio real (zensi.ai): usa example.com o .test"
regex = '''(?i)\bzensi\.ai\b'''
keywords = ["zensi"]

# DevEUI/JoinEUI (16 hex) y AppKey/NwkKey (32 hex). Los fixtures inventados viven en e2e/ y en *.test.ts,
# que ya están en la allowlist global; en el resto del repo un hex así es un identificador o clave real.
[[rules]]
id = "lorawan-deveui-hex16"
description = "Hex de 16 caracteres con forma de DevEUI/JoinEUI"
regex = '''(?i)(?:^|[^0-9a-f])[0-9a-f]{16}(?:[^0-9a-f]|$)'''
keywords = []

[[rules]]
id = "lorawan-appkey-hex32"
description = "Hex de 32 caracteres con forma de AppKey/NwkKey"
regex = '''(?i)(?:^|[^0-9a-f])[0-9a-f]{32}(?:[^0-9a-f]|$)'''
keywords = []
