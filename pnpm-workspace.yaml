packages:
  - apps/*
  - packages/*
  - e2e

# pnpm 12 bloquea scripts de instalación por defecto; solo se permite lo estrictamente necesario.
allowBuilds:
  esbuild: true
  lefthook: true
  cpu-features: false
  protobufjs: false
  ssh2: false
  vue-demi: false
  # argon2 trae binarios precompilados (prebuilds/); no hace falta compilar en la instalación.
  argon2: false

# RNF-09: versiones exactas siempre.
savePrefix: ''
