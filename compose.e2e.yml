# Stack tipo producción para e2e y para probar las imágenes:
#   docker compose -f compose.e2e.yml up -d --build --wait web worker
#   docker compose -f compose.e2e.yml run --rm --build e2e
#   docker compose -f compose.e2e.yml down --volumes
# (no usar `up --exit-code-from`: implica abortar al terminar `migrate`, que es un servicio de un solo uso).
# Postgres, API, worker y Caddy usan las imágenes finales; el runner de Playwright es la imagen oficial.
name: inventarius-e2e

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: warn
  DATABASE_URL: postgres://inventarius_app:e2e-app-password@postgres:5432/inventarius
  MIGRATION_DATABASE_URL: postgres://inventarius_migrator:e2e-migrator-password@postgres:5432/inventarius

services:
  postgres:
    image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_PASSWORD: e2e-admin-password
      APP_DB_PASSWORD: e2e-app-password
      MIGRATOR_DB_PASSWORD: e2e-migrator-password
    volumes:
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d inventarius']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., target: api }
    command: ['node', 'dist/migrate.js']
    environment: *app-env
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., target: api }
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build: { context: ., target: api }
    command: ['node', 'dist/worker.js']
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ., target: web }
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/api/health/live']
      interval: 3s
      timeout: 3s
      retries: 20

  e2e:
    build: { context: ., target: e2e }
    environment:
      BASE_URL: http://web:8080
    volumes:
      - ./e2e/playwright-report:/repo/e2e/playwright-report
      - ./e2e/test-results:/repo/e2e/test-results
    depends_on:
      web: { condition: service_healthy }
