commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-commit:
  commands:
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    gitleaks:
      # Versión fijada en scripts/gitleaks.sh (la misma que usa el CI). Revisa solo lo que se va a commitear.
      run: scripts/gitleaks.sh staged
