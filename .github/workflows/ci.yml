name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '12.21.0'

jobs:
  lint-typecheck:
    name: Lint y typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/check-playwright-version.mjs
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Tests unitarios (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['26.13.1', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test

  integration:
    name: Integración con Postgres 18 y cobertura
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Testcontainers levanta Postgres con el Docker del runner.
      - run: pnpm test:coverage

  e2e:
    name: E2E Playwright + axe (Docker)
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p e2e/playwright-report e2e/test-results
      - run: docker compose -f compose.e2e.yml up -d --build --wait web worker
      - run: docker compose -f compose.e2e.yml run --rm --build e2e
      - if: failure()
        run: docker compose -f compose.e2e.yml logs --no-color --tail=200
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f compose.e2e.yml down --volumes

  security:
    name: Auditoría de dependencias y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --prod --audit-level high
      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=pnpm-lock.yaml
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Build de imágenes y Trivy
    runs-on: ubuntu-latest
    needs: [e2e, security]
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: inventarius-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: inventarius-${{ matrix.target }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
