name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '12.21.0'

jobs:
  lint-typecheck:
    name: Lint y typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/check-playwright-version.mjs
      - run: node scripts/check-actions-pinned.mjs
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Tests unitarios (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 24 es el runtime (LTS, igual que .nvmrc y la imagen); 26 flota y es solo una alerta temprana de compatibilidad.
        node: ['24.22.3', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test

  integration:
    name: Integración con Postgres 18 y cobertura
    runs-on: ubuntu-24.04
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Testcontainers levanta Postgres con el Docker del runner.
      - run: pnpm test:coverage

  e2e:
    name: E2E Playwright + axe (Docker)
    runs-on: ubuntu-24.04
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: mkdir -p e2e/playwright-report e2e/test-results
      - run: docker compose -f compose.e2e.yml up -d --build --wait web worker
      - run: docker compose -f compose.e2e.yml run --rm --build e2e
      - if: failure()
        run: docker compose -f compose.e2e.yml logs --no-color --tail=200
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f compose.e2e.yml down --volumes

  security:
    name: Auditoría de dependencias y secretos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --prod --audit-level high
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=pnpm-lock.yaml
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reglas propias de gitleaks (cada patrón debe fallar)
        run: scripts/test-gitleaks.sh

  images:
    name: Build de imágenes y Trivy
    runs-on: ubuntu-24.04
    needs: [e2e, security]
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: inventarius-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: inventarius-${{ matrix.target }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
